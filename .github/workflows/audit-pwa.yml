name: Auditoría PWA · caché aislada
on:
  pull_request:
    paths:
      - 'sw.js'
      - 'tests/audit-sw.mjs'
      - 'tests/audit-tecgo.mjs'
      - '.github/workflows/audit-pwa.yml'
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'tests/audit-sw.mjs'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/audit-sw.mjs
      - run: node tests/audit-tecgo.mjs
